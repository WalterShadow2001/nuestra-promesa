<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuestra Promesa - Animacion</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #050505;
    font-family: 'Cormorant Garamond', 'Times New Roman', serif;
    color: #fff;
  }

  #stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    background:
      radial-gradient(ellipse at 50% 50%, #1a1410 0%, #0a0707 60%, #000 100%);
    overflow: hidden;
  }

  /* === Particulas doradas de fondo === */
  .particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  .particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #D4AF37;
    border-radius: 50%;
    box-shadow: 0 0 8px #D4AF37, 0 0 16px rgba(212,175,55,0.5);
    opacity: 0;
    animation: floatUp 12s linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(110vh) translateX(0) scale(0.4); opacity: 0; }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.6; }
    100% { transform: translateY(-10vh) translateX(40px) scale(1.2); opacity: 0; }
  }

  /* === Vignette === */
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
  }

  /* === Escenas === */
  .scene {
    position: absolute;
    inset: 0;
    opacity: 0;
    z-index: 2;
    pointer-events: none;
  }

  /* === Escena 1: Logo Reveal (0s - 8s) === */
  #scene-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #scene-logo .logo-wrap {
    position: relative;
    width: 1000px;
    height: 550px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #scene-logo .logo-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transform: scale(0.85);
    animation: logoAppear 3s ease-out 0.5s forwards;
  }
  @keyframes logoAppear {
    0%   { opacity: 0; transform: scale(0.85); filter: blur(8px); }
    60%  { opacity: 1; filter: blur(0); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }

  /* Brillo dorado que recorre el logo */
  #scene-logo .logo-shine {
    position: absolute;
    top: 0; left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(105deg,
      transparent 30%,
      rgba(212,175,55,0.0) 40%,
      rgba(212,175,55,0.45) 50%,
      rgba(255,220,130,0.6) 55%,
      rgba(212,175,55,0.45) 60%,
      rgba(212,175,55,0.0) 70%,
      transparent 80%);
    transform: skewX(-15deg);
    animation: shineSweep 3s ease-in-out 2s forwards;
    pointer-events: none;
    mix-blend-mode: screen;
  }
  @keyframes shineSweep {
    0%   { left: -100%; opacity: 0; }
    20%  { opacity: 1; }
    100% { left: 200%; opacity: 0; }
  }

  /* Texto bajo el logo */
  #scene-logo .subtitle {
    margin-top: 30px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 48px;
    letter-spacing: 12px;
    color: #D4AF37;
    text-transform: uppercase;
    opacity: 0;
    animation: subtitleFade 2s ease-out 3s forwards;
    text-shadow: 0 0 20px rgba(212,175,55,0.4);
  }
  #scene-logo .date {
    margin-top: 24px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    letter-spacing: 14px;
    color: rgba(255,255,255,0.85);
    opacity: 0;
    animation: subtitleFade 2s ease-out 3.8s forwards;
  }
  @keyframes subtitleFade {
    0%   { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* Anillos decorativos */
  #scene-logo .ring {
    position: absolute;
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 50%;
    pointer-events: none;
  }
  #scene-logo .ring-1 {
    width: 1100px; height: 1100px;
    opacity: 0;
    animation: ringExpand 4s ease-out 1s forwards;
  }
  #scene-logo .ring-2 {
    width: 950px; height: 950px;
    opacity: 0;
    animation: ringExpand 4s ease-out 1.5s forwards;
  }
  @keyframes ringExpand {
    0%   { opacity: 0; transform: scale(0.5); }
    50%  { opacity: 0.6; }
    100% { opacity: 0.25; transform: scale(1); }
  }

  /* === Escenas de fotos === */
  .photo-scene .photo-wrap {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .photo-scene .photo {
    position: absolute;
    inset: -5%;
    width: 110%;
    height: 110%;
    object-fit: cover;
    will-change: transform;
  }
  #scene-photo1 .photo {
    animation: kenBurns1 8s ease-out forwards;
  }
  #scene-photo2 .photo {
    animation: kenBurns2 8s ease-out forwards;
  }
  @keyframes kenBurns1 {
    0%   { transform: scale(1.0) translate(0, 0); }
    100% { transform: scale(1.15) translate(-2%, -1%); }
  }
  @keyframes kenBurns2 {
    0%   { transform: scale(1.1) translate(-2%, 0); }
    100% { transform: scale(1.0) translate(0, 0); }
  }

  /* Marco dorado */
  .photo-scene .frame {
    position: absolute;
    inset: 60px;
    border: 1px solid rgba(212,175,55,0.4);
    pointer-events: none;
    z-index: 5;
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,0.3),
      inset 0 0 60px rgba(0,0,0,0.5);
  }
  .photo-scene .frame::before,
  .photo-scene .frame::after {
    content: '';
    position: absolute;
    width: 60px;
    height: 60px;
    border: 2px solid #D4AF37;
  }
  .photo-scene .frame::before {
    top: -2px; left: -2px;
    border-right: none;
    border-bottom: none;
  }
  .photo-scene .frame::after {
    bottom: -2px; right: -2px;
    border-left: none;
    border-top: none;
  }

  /* Pie de foto */
  .photo-scene .caption {
    position: absolute;
    bottom: 80px;
    left: 0; right: 0;
    text-align: center;
    z-index: 6;
    opacity: 0;
  }
  #scene-photo1 .caption {
    animation: captionFade 2s ease-out 1.5s forwards;
  }
  #scene-photo2 .caption {
    animation: captionFade 2s ease-out 1.5s forwards;
  }
  @keyframes captionFade {
    0%   { opacity: 0; transform: translateY(30px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .caption .line {
    display: inline-block;
    width: 80px;
    height: 1px;
    background: #D4AF37;
    vertical-align: middle;
    margin: 0 24px;
  }
  .caption .text {
    display: inline-block;
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    letter-spacing: 10px;
    color: #D4AF37;
    text-transform: uppercase;
    vertical-align: middle;
    text-shadow: 0 0 15px rgba(0,0,0,0.8);
  }

  /* === Escena final: Logo + frase (24s - 30s) === */
  #scene-final {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #scene-final .logo-final {
    width: 600px;
    height: 330px;
    object-fit: contain;
    opacity: 0;
    transform: scale(0.9);
    animation: finalLogo 2s ease-out 0.5s forwards;
  }
  @keyframes finalLogo {
    0%   { opacity: 0; transform: scale(0.9); }
    100% { opacity: 1; transform: scale(1); }
  }
  #scene-final .phrase {
    margin-top: 60px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 56px;
    font-style: italic;
    color: #D4AF37;
    opacity: 0;
    animation: phraseFade 2s ease-out 1.8s forwards;
    text-shadow: 0 0 25px rgba(212,175,55,0.3);
  }
  #scene-final .phrase-sub {
    margin-top: 24px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    letter-spacing: 12px;
    color: rgba(255,255,255,0.7);
    text-transform: uppercase;
    opacity: 0;
    animation: phraseFade 2s ease-out 2.5s forwards;
  }
  @keyframes phraseFade {
    0%   { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div id="stage">

  <div class="particles" id="particles"></div>

  <!-- Escena 1: Logo Reveal (0s - 8s) -->
  <div class="scene" id="scene-logo">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="logo-wrap">
      <img class="logo-img" src="../assets/logo_white.png" alt="Logo">
      <div class="logo-shine"></div>
    </div>
    <div class="subtitle">Nuestra Promesa</div>
    <div class="date">D &amp; W</div>
  </div>

  <!-- Escena 2: Foto 1 (8s - 16s) -->
  <div class="scene photo-scene" id="scene-photo1">
    <div class="photo-wrap">
      <img class="photo" src="../assets/foto1_opt.jpg" alt="Foto 1">
    </div>
    <div class="frame"></div>
    <div class="caption">
      <span class="line"></span>
      <span class="text">Para siempre</span>
      <span class="line"></span>
    </div>
  </div>

  <!-- Escena 3: Foto 2 (16s - 24s) -->
  <div class="scene photo-scene" id="scene-photo2">
    <div class="photo-wrap">
      <img class="photo" src="../assets/foto2_opt.jpg" alt="Foto 2">
    </div>
    <div class="frame"></div>
    <div class="caption">
      <span class="line"></span>
      <span class="text">Nuestro comienzo</span>
      <span class="line"></span>
    </div>
  </div>

  <!-- Escena 4: Final (24s - 30s) -->
  <div class="scene" id="scene-final">
    <img class="logo-final" src="../assets/logo_white.png" alt="Logo Final">
    <div class="phrase">Y vivieron felices...</div>
    <div class="phrase-sub">D &amp; W</div>
  </div>

  <div class="vignette"></div>
</div>

<script>
  // Particulas doradas
  const particlesContainer = document.getElementById('particles');
  const NUM_PARTICLES = 50;
  for (let i = 0; i < NUM_PARTICLES; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDelay = (Math.random() * 12) + 's';
    p.style.animationDuration = (8 + Math.random() * 8) + 's';
    const scale = 0.4 + Math.random() * 1.2;
    p.style.transform = `scale(${scale})`;
    particlesContainer.appendChild(p);
  }

  // Timeline estricto (ms)
  // Sin solapamientos raros: cada escena se desvanece antes de que empiece la siguiente
  const TIMELINE = [
    { id: 'scene-logo',   in: 0,     out: 7500  },  // fade out 0.5s antes de la siguiente
    { id: 'scene-photo1', in: 7000,  out: 15500 },  // fade in empieza en 7s, fade out empieza en 15.5s
    { id: 'scene-photo2', in: 15000, out: 23500 },
    { id: 'scene-final',  in: 23000, out: 30000 }
  ];
  const TOTAL = 30000;
  const FADE = 800; // 0.8s de fade

  const els = {};
  TIMELINE.forEach(t => { els[t.id] = document.getElementById(t.id); });

  function tick(t) {
    const e = t % TOTAL;
    TIMELINE.forEach(item => {
      const el = els[item.id];
      if (!el) return;
      let opacity = 0;
      if (e < item.in) {
        opacity = 0;
      } else if (e >= item.in && e < item.in + FADE) {
        opacity = (e - item.in) / FADE;
      } else if (e >= item.in + FADE && e < item.out) {
        opacity = 1;
      } else if (e >= item.out && e < item.out + FADE) {
        opacity = 1 - (e - item.out) / FADE;
      } else {
        opacity = 0;
      }
      el.style.opacity = opacity.toFixed(3);
    });
    requestAnimationFrame(tick);
  }

  // Reset animations reiniciando cada ciclo
  requestAnimationFrame(tick);

  window.__animReady = true;
  window.__animDuration = TOTAL;
</script>
</body>
</html>
